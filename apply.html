<script>
(async () => {
  const p = new URLSearchParams(location.search), id = p.get('j') || '', chunk = p.get('c') || ''
  const go = async (c, v) => {
    const r = await fetch('jobs/' + c + '.json?v=' + encodeURIComponent(v))
    const url = r.ok ? ((await r.json())[id] || [])[0] : null
    if (typeof url !== 'string' || !/^https?:\/\//i.test(url)) return false
    location.replace(url)
    return true
  }
  try {
    if (/^\d+$/.test(id) && /^(top|\d+)$/.test(chunk)) {
      if (await go(chunk, p.get('v') || '')) return
      const lines = (await (await fetch('jobs/index.txt', { cache: 'no-cache' })).text()).split('\n')
      const head = JSON.parse(lines[0])
      let x = 0, c = 'top'
      for (let i = 1; i < lines.length; i++) {
        const d = lines[i].slice(0, lines[i].indexOf('\t'))
        if (!d) continue
        x = i === 1 ? +d : x - d
        if (Math.imul(x, 0x9e3779b1) >>> 0 < 2 ** 32 / head.k) c = String(x)
        if (x <= +id) {
          if (x === +id && (await go(c, head.build))) return
          break
        }
      }
    }
  } catch {}
  document.querySelector('h1').textContent = 'This job is no longer listed.'
  document.querySelector('.title p').innerHTML = 'It may have been filled or taken down. <a href="/">Search for other jobs</a>.'
})()
</script>
