<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Answers, left ads | GiveMeAFuckingJ*b</title>
  <script>
    // The app says which theme it is showing (?theme=light or ?theme=dark). Without that, the system's.
    var theme = new URLSearchParams(location.search).get('theme')
    if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme)
  </script>
  <style>
    /* The app's own background: light oklch(0.97 0 0) is #f5f5f5, dark oklch(0.145 0 0) is #0a0a0a. */
    :root { --bg: #f5f5f5; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #0a0a0a; color-scheme: dark; }
    }
    :root[data-theme="dark"] { --bg: #0a0a0a; color-scheme: dark; }
    html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
    body { box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; }
    /* Two ads, one above the other, each in half the height. */
    .ad { flex: 1 1 0; min-height: 0; overflow: hidden; text-align: center; }
  </style>
</head>
<body>
  <div class="ad">
    <!-- Ad 1: paste the ad's code here. -->
  </div>
  <div class="ad">
    <!-- Ad 2: paste the ad's code here. -->
  </div>
  <script>
    // Tells the app this page is here, so it shows it. A missing page, or no connection, shows nothing.
    parent.postMessage({ gmafjAds: 'ready' }, '*')
  </script>
</body>
</html>
